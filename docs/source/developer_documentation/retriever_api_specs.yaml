openapi: 3.1.1
info:
  title: mmore Retriever API
  description: |
    This API is based on the OpenAPI 3.1 specification. You can find out more about Swagger at [https://swagger.io](https://swagger.io).

    ## Overview

    This API defines the retriever API of mmore, handling:

    1. **File Operations** - Direct file management within mmore.
    2. **Context Retrieval** - Semantic search based on the subset of documents that the user wants.

    ## API Versioning

    All requests must be prefixed with `/v1` for this current version of the API.

    ## Roadmap & Considerations
    - Authorization layer for mmore operations
    - Permission control on some operation such as file deletion
    - Advanced query for retrieval (send more sophisticated object, for instance representing a whole conversation, rather than one string)

  version: 1.0.0
servers:
  - url: /v1
    description: API server

paths:
  /files:
    post:
      tags:
        - File Operations
      summary: Upload a file
      description: |
        Upload a new file

         **Requirements**:
        - Unique fileId
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fileId:
                  type: string
                  description: Unique identifier for the file
                file:
                  type: string
                  format: binary
                  description: The file content
                collectionName:
                  type: string
                  description: |
                    Collection to index into. Defaults to the configured
                    `collection_name`. Created if it does not exist.
              required:
                - fileId
                - file
      responses:
        "201":
          description: File successfully uploaded

  /files/bulk:
    post:
      tags:
        - File Operations
      summary: Upload multiple files
      description: |
        Upload several files at once, one independent job per file. All files
        are indexed into the same collection.

         **Requirements**:
        - One unique ID per file, in the same order as the files
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                listIds:
                  type: array
                  items:
                    type: string
                  description: |
                    IDs of the files, in the same order as `files`. Each
                    entry may also hold several comma-separated IDs.
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: The files' contents
                collectionName:
                  type: string
                  description: |
                    Collection to index into. Defaults to the configured
                    `collection_name`. Created if it does not exist.
              required:
                - listIds
                - files
      responses:
        "202":
          description: Per-file outcome, either a jobId or an error
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        fileId:
                          type: string
                        jobId:
                          type: string
                        error:
                          type: string
        "400":
          description: Number of IDs does not match number of files

  /list_files:
    get:
      tags:
        - Files
      summary: List all files
      description: Retrieve a list of all files stored in a collection, sorted by file id.
      parameters:
        - name: collectionName
          in: query
          required: false
          description: |
            Collection to list the files of. Defaults to the configured
            `collection_name`. A collection that does not exist returns an
            empty list.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: A list of files
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    filename:
                      type: string

  /files/{fileId}:
    put:
      tags:
        - File Operations
      summary: Update a file
      description: Replace an existing file with a new version
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The new file content
                collectionName:
                  type: string
                  description: |
                    Collection the file is indexed in. Defaults to the
                    configured `collection_name`.
              required:
                - file
      responses:
        "200":
          description: File successfully updated
        "404":
          description: File or collection not found

    delete:
      tags:
        - File Operations
      summary: Remove a file
      description: |
        Delete a file from the system.

        **Warning**: Not limited operation.
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
        - name: collectionName
          in: query
          required: false
          description: |
            Collection the file is indexed in. Defaults to the configured
            `collection_name`.
          schema:
            type: string
      responses:
        "200":
          description: File successfully deleted
        "404":
          description: File or collection not found

    get:
      tags:
        - File Operations
      summary: Download a file
      description: |
        Download a file from the system. The file is named after its
        `filename` metadata (see `PATCH /files/{fileId}/metadata`).
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
        - name: collectionName
          in: query
          required: false
          description: |
            Collection the file is indexed in. Defaults to the configured
            `collection_name`.
          schema:
            type: string
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: File or collection not found

  /files/{fileId}/metadata:
    get:
      tags:
        - File Operations
      summary: Get the file-level metadata of a file
      description: |
        Returns the metadata shared by every chunk of the file: keys present on
        all its chunks with the same value (e.g. `filename`). Chunk-level
        metadata (e.g. `paragraph_positions`) is not included.
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
        - name: collectionName
          in: query
          required: false
          description: |
            Collection the file is indexed in. Defaults to the configured
            `collection_name`.
          schema:
            type: string
      responses:
        "200":
          description: File-level metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMetadata"
        "404":
          description: File or collection not found

    patch:
      tags:
        - File Operations
      summary: Patch the file-level metadata of a file
      description: |
        Merges the body into the metadata of every chunk of the file, without
        re-indexing (embeddings are kept as is).

        - a new key is added, an existing key is updated, a key set to `null`
          is deleted (deleting a missing key is a no-op)
        - values must be JSON scalars (string, number, boolean) or `null`
        - an existing key keeps its type
        - protected keys cannot be patched nor deleted: `id`, `document_id`,
          `text`, the embeddings, `file_path`, `processed_at`, `processor_type`
        - a key that differs across the chunks (chunk-level) cannot be patched
          file-wide, use `PATCH /files/{fileId}/chunks/{chunkId}/metadata`

        **Warning**: the chunks are rewritten in batches, a failure midway can
        leave the file partially patched. The patch is idempotent, send it again.
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
        - name: collectionName
          in: query
          required: false
          description: |
            Collection the file is indexed in. Defaults to the configured
            `collection_name`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataPatch"
            example:
              filename: renamed.pdf
              author: null
      responses:
        "200":
          description: File-level metadata after the patch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMetadata"
        "404":
          description: File or collection not found
        "422":
          description: |
            Invalid patch (empty, protected key, wrong type, non-scalar value,
            or chunk-level key), with the list of problems in `detail`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataPatchErrors"

  /files/{fileId}/chunks/{chunkId}/metadata:
    patch:
      tags:
        - File Operations
      summary: Patch the metadata of a single chunk
      description: |
        Merges the body into the metadata of one chunk only, without
        re-indexing. The other chunks of the file are left untouched.

        Same rules as `PATCH /files/{fileId}/metadata` (merge, `null` deletes,
        JSON scalars, type kept, protected keys), except that any key can be
        patched on the chunk.

        **Warning**: choosing the right key is the caller's responsibility.
        Patching a file-level key (e.g. `filename`) on one chunk makes it differ
        across the chunks, so it is no longer returned by
        `GET /files/{fileId}/metadata`.
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
        - name: chunkId
          in: path
          required: true
          description: Identifier of the chunk within the file (as returned by `/retrieve`)
          schema:
            type: string
        - name: collectionName
          in: query
          required: false
          description: |
            Collection the file is indexed in. Defaults to the configured
            `collection_name`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataPatch"
            example:
              reviewed: true
      responses:
        "200":
          description: Every metadata of the chunk after the patch, chunk-level keys included
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileId:
                    type: string
                  chunkId:
                    type: string
                  collectionName:
                    type: string
                  metadata:
                    type: object
                    additionalProperties: true
              example:
                fileId: doc123
                chunkId: "3"
                collectionName: my_docs
                metadata:
                  filename: report.pdf
                  file_path: ./uploads/doc123
                  paragraph_positions: [[120, 340]]
                  reviewed: true
        "404":
          description: Chunk or collection not found
        "422":
          description: |
            Invalid patch (empty, protected key, wrong type or non-scalar
            value), with the list of problems in `detail`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataPatchErrors"

  /retrieve:
    post:
      tags:
        - Context Retrieval
      summary: Retrieve on mmore
      description: |
        Search for files based on content similarity.

        This request is meant to be called by the Gateway to mmore service upon chat completions request from Moove.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileIds:
                  type: array
                  items:
                    type: string
                  description: List of file IDs to search within
                maxMatches:
                  type: integer
                  minimum: 1
                  description: Maximum number of matches to return
                minSimilarity:
                  type: number
                  format: float
                  minimum: -1.0
                  maximum: 1.0
                  default: 0.0
                  description: Minimum similarity score for results (-1.0 to 1.0)
                query:
                  type: string
                  description: Search query
                collectionName:
                  type: string
                  description: |
                    Collection to search in. Defaults to the configured
                    `collection_name`. Only this collection is searched:
                    `fileIds` of another collection match nothing, and a
                    collection that does not exist returns an empty list.
              required:
                - fileIds
                - query
                - maxMatches
      responses:
        "200":
          description: List of matching files with related content, sorted by highest similarity first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    fileId:
                      type: string
                    chunkId:
                      type: string
                      nullable: true
                      description: Id of the chunk. `null` for a full document.
                    filePath:
                      type: string
                      description: |
                        Path of the source file used during indexing. Useful
                        for human-readable citations. Empty string when the
                        post-processor did not record one.
                    content:
                      type: string
                    similarity:
                      type: number
                      format: float
                      minimum: -1.0
                      maximum: 1.0
                    metadata:
                      allOf:
                        - $ref: "#/components/schemas/ChunkRange"
                      nullable: true
                      description: |
                        Positional range of the chunk inside the source document.
                        `null` when the source has no page/paragraph structure.
                description: Results sorted by similarity (highest first)

  /chunks/{fileId}/{chunkId}:
    get:
      tags:
        - Context Retrieval
      summary: Fetch a chunk's content and metadata by reference
      description: |
        Returns the text content and positional metadata for a single chunk,
        identified by its `fileId` + `chunkId` (as returned by `/retrieve`).

        Consumers can persist only the `{fileId, chunkId}` reference and
        fetch the content/metadata on demand, avoiding duplicated storage.
      parameters:
        - name: fileId
          in: path
          required: true
          description: Identifier of the source file. Must not contain `+` or `"`.
          schema:
            type: string
            pattern: '^[^"+]+$'
        - name: chunkId
          in: path
          required: true
          description: Identifier of the chunk within the file. Must not contain `+` or `"`.
          schema:
            type: string
            pattern: '^[^"+]+$'
        - name: collectionName
          in: query
          required: false
          description: |
            Collection the chunk is indexed in. Defaults to the configured
            `collection_name`. Only this collection is looked up.
          schema:
            type: string
      responses:
        "200":
          description: The chunk's content and positional metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileId:
                    type: string
                  chunkId:
                    type: string
                  filePath:
                    type: string
                    description: |
                      Path of the source file used during indexing. Empty
                      string when not recorded.
                  filename:
                    type: string
                    nullable: true
                    description: Original filename of the source document.
                  content:
                    type: string
                  metadata:
                    allOf:
                      - $ref: "#/components/schemas/ChunkRange"
                    nullable: true
                    description: |
                      Positional range of the chunk inside the source document.
                      `null` when the source has no page/paragraph structure.
        "400":
          description: Invalid `fileId` or `chunkId` (e.g. contains disallowed characters)
        "404":
          description: Collection not found, or no chunk found for the given `fileId` + `chunkId` in it

components:
  schemas:
    MetadataPatch:
      type: object
      description: |
        Merge patch: a key is added or updated with the given value, a key set
        to `null` is deleted, keys not in the body are left untouched.
      minProperties: 1
      additionalProperties:
        type:
          - string
          - number
          - boolean
          - "null"
    FileMetadata:
      type: object
      properties:
        fileId:
          type: string
        collectionName:
          type: string
        chunks:
          type: integer
          description: Number of chunks of the file
        metadata:
          type: object
          additionalProperties: true
          description: Metadata shared by every chunk of the file
      example:
        fileId: doc123
        collectionName: my_docs
        chunks: 12
        metadata:
          filename: report.pdf
          file_path: ./uploads/doc123
    MetadataPatchErrors:
      type: object
      properties:
        detail:
          description: One message per invalid key, or a single message for an empty patch
          oneOf:
            - type: array
              items:
                type: string
            - type: string
      example:
        detail:
          - "'file_path' is protected and cannot be patched"
          - "'filename' must stay a string, got number"
    ChunkPosition:
      type: object
      properties:
        page:
          type: integer
        paragraph:
          type: integer
      required:
        - page
        - paragraph
    ChunkRange:
      type: object
      properties:
        first:
          $ref: "#/components/schemas/ChunkPosition"
        last:
          $ref: "#/components/schemas/ChunkPosition"
      required:
        - first
        - last
