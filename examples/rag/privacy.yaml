# Privacy config
interactive: true  # HITL
context_analyzer:
  llm:
    llm_name: meta-llama/Meta-Llama-3-8B-Instruct
detection:
  engine: null  # presidio | gliner | llm | openai_filter
  confidence_threshold: 0.7
  entity_types: []
sanitization:
  strategy: null   # token_masking | entity_replacement | synthetic_rewrite | presidio
  consistency: true
leakage_adversary:
  enabled: false
  max_iterations: 3
  leakage_threshold: 0.9
  llm:
    llm_name: meta-llama/Meta-Llama-3-8B-Instruct
answer:  # CloudLLMConfig: any LLMConfig backend
  llm:
    llm_name: meta-llama/Meta-Llama-3-8B-Instruct
  # system_prompt: ...  # optional
verifier:
  warn_threshold: 0.5
  llm:
    llm_name: meta-llama/Meta-Llama-3-8B-Instruct
