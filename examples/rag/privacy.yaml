# Privacy config
# Sections set to null are decided at runtime by the context analyzer.

#domain: global  # global | healthcare | humanitarian, unset => inferred per query
interactive: true

context_analyzer:
  llm: &slm
    llm_name: Qwen/Qwen2.5-3B-Instruct
    #base_url: http://localhost:8000/v1
    #provider: HF  # HF | OPENAI | ANTHROPIC | MISTRAL | COHERE
    #max_new_tokens: null
    #temperature: 0.7
  #system_prompt: ...

detection:
  engine: presidio  # presidio | gliner | llm | openai_filter
  confidence_threshold: 0.7
  entity_types: []  # empty => PERSON, PHONE_NUMBER, EMAIL_ADDRESS, MRN, DATE_TIME, LOCATION, US_SSN, INSURANCE_ID
  #llm: *slm  # only used when engine is `llm`

sanitization:
  strategy: presidio  # token_masking | entity_replacement | synthetic_rewrite | presidio
  consistency: true
  #llm: *slm  # only used when strategy is `synthetic_rewrite`
  #encryption_key: ...  # for the presidio `encrypt` operator

leakage_adversary:
  enabled: true
  max_iterations: 1
  leakage_threshold: 0.9
  abort_on_exhaustion: false
  #strategies:  # defaults to all
  #  - residual_span
  #  - quasi_identifier
  #  - structural_reid
  #  - context_reconstruction
  #  - membership_inference
  llm: *slm

answer:
  llm: *slm
  #system_prompt: ...

verifier:
  warn_threshold: 0.5
  #checks:  # defaults to all
  #  - residual_leakage
  #  - faithfulness
  llm: *slm
